version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: pgms_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pgms_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pgms_password}
      POSTGRES_DB: ${POSTGRES_DB:-pgms_db}
    ports:
      - "5432:5432"
    volumes:
      - pgms_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pgms_user} -d ${POSTGRES_DB:-pgms_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pgms_backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-pgms_user}:${POSTGRES_PASSWORD:-pgms_password}@db:5432/${POSTGRES_DB:-pgms_db}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app

volumes:
  pgms_postgres_data:
